name: Keep Streamlit Alive

on:
  schedule:
    # 每 30 分鐘自動執行一次，發送請求訪問您的網頁
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # 請將下方網址替換為您的 Streamlit 實際公開網址
          curl -I https://stockmonitor-fzuvsmthwzljph76b88vzc.streamlit.app/
